services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      # Chỉ mở cho máy local (để SSMS kết nối), không mở ra Internet
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ml-service:
    build: ./ml-service
    environment:
      # (Tùy chọn) Nếu đặt thì mọi API của ML service (trừ /health) phải gửi header X-API-Key
      ML_API_KEY: ${ML_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Các phiên bản mô hình huấn luyện lại được lưu ở đây. Lần đầu volume nhận mô hình ban đầu từ image
      - ml-models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  backend:
    build: ./backend
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=DACN;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      MlService__BaseUrl: "http://ml-service:8000"
      Jwt__Key: ${JWT_KEY}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
      Seed__DemoPassword: ${DEMO_PASSWORD:-}
      Import__DefaultPassword: ${IMPORT_DEFAULT_PASSWORD:-}
      MlService__ApiKey: ${ML_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      ml-service:
        condition: service_healthy

volumes:
  sqlserver-data:
  ml-models:
